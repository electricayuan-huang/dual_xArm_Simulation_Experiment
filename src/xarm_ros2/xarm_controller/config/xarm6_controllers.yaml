controller_manager:
  ros__parameters:
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    update_rate: 1000
    xarm6_traj_controller:
      type: joint_trajectory_controller/JointTrajectoryController
xarm6_traj_controller:
  ros__parameters:
    command_interfaces:
    - position
    initial_positions:
      joint1: 0.0
      joint2: 0.0
      joint3: 0.0
      joint4: 0.0
      joint5: -1.5708
      joint6: 0.0
    joints:
    - joint1
    - joint2
    - joint3
    - joint4
    - joint5
    - joint6
    state_interfaces:
    - position
    - velocity
